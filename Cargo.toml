[package]
name = "irisqo"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
# Runtime
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7.20" }
futures = "0.3.34"
async-channel = "2.5"
# JSON libs
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
http-serde = "2.1"
# Web libs
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace"] }
hyper = { version = "1.12", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["client-legacy"] }
hyper-tls = { version = "0.6" }
http = "1"
http-body-util = { version = "0.1" }
url = { version = "2.5" }
ipnet = "2"
tower-service = "0.3"
hmac = "0.13"
sha2 = "0.11"
# Configuration & Observability
dotenvy = "0.15"
opentelemetry = { version = "0.33", features = ["trace", "metrics", "logs"] }
# OTLP over HTTP/protobuf (plain HTTP: a local collector/agent); the batch processor runs
# on its own thread, hence the blocking client
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = "0.33"
opentelemetry-stdout = { version = "0.33", features = ["trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.33"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = { version = "0.34" }
xflags = { version = "0.3" }

# DB
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-native-tls", "postgres", "macros", "migrate", "chrono", "json"] }
# sqlb = "0.0.8"
# Types
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
whoami = { version = "2.0" }
bytes = { version = "1", features = ["serde"] }
ulid = { version = "3" }
cron = { version = "0.17" }
fastrand = "2"

[features]
# Integration tests need a Postgres server: DATABASE_URL=postgres://... cargo test --features integration-tests
integration-tests = []

[dev-dependencies]
anyhow = "1"
opentelemetry_sdk = { version = "0.33", features = ["testing"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["integration-tests"]
