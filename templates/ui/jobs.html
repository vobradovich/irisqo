{% extends "ui/layout.html" %}
{% block title %}Jobs{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Jobs</h1>
  <a href="/ui/jobs/new" role="button"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New job</a>
</div>

<div class="filters" hx-boost:inherited="true" hx-target:inherited="main" hx-select:inherited="main" hx-select-oob:inherited="#header-live" hx-swap:inherited="outerMorph show:none" hx-sync:inherited="#jobs-live:replace">
  <nav class="segmented" aria-label="Status">
    <ul>
      {% for f in list.filters %}
      <li><a href="{{ f.href }}"{% if f.current %} aria-current="page"{% endif %}>{{ f.label }}</a></li>
      {% endfor %}
    </ul>
  </nav>
  <search>
    <form method="get" action="/ui/jobs">
      <input type="hidden" name="status" value="{{ list.status }}">
      {% if !list.live %}<input type="hidden" name="live" value="0">{% endif %}
      <label for="source-filter">Source
        <select id="source-filter" name="source">
          <option value="any"{% if list.source == "any" %} selected{% endif %}>Any</option>
          <option value="schedule"{% if list.source == "schedule" %} selected{% endif %}>Schedule runs</option>
          <option value="callbacks"{% if list.source == "callbacks" %} selected{% endif %}>Callbacks</option>
          <option value="direct"{% if list.source == "direct" %} selected{% endif %}>Direct</option>
        </select>
      </label>
      <label for="q" class="grow">Search
        <input id="q" type="search" name="q" value="{{ list.q }}" placeholder="Job id, key or URL">
      </label>
      <button type="submit" class="secondary">Filter</button>
    </form>
  </search>
</div>

{% include "ui/partials/jobs_live.html" %}
{% endblock %}
