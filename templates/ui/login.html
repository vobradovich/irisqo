{% extends "ui/layout.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="login" aria-labelledby="login-title">
  <h1 id="login-title">Log in</h1>
  <p class="muted">The UI takes an API token of this instance (<span class="mono">IRISQO_API_TOKEN</span>).</p>
  {% if error %}<div class="alert error" role="alert">The token is not valid.</div>{% endif %}
  <form method="post" action="/ui/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="token">API token
      <input id="token" name="token" type="password" class="mono" autocomplete="current-password" required autofocus
        {%- if error %} aria-invalid="true"{% endif %}>
    </label>
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
