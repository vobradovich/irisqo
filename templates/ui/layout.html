<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="htmx-config" content='{"includeIndicatorCSS": false}'>
  <title>{% block title %}{% endblock %} · irisqo</title>
  <link rel="stylesheet" href="/ui/assets/pico-2.1.1.classless.min.css">
  <link rel="stylesheet" href="/ui/assets/app.css">
  <script src="/ui/assets/htmx-4.0.1.min.js" defer></script>
</head>
<body>
  <header>
    <nav aria-label="Main">
      <ul>
        <li>
          <a href="/ui" class="brand">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="4" rx="1.5"></rect><rect x="3" y="10" width="13" height="4" rx="1.5"></rect><rect x="3" y="16" width="8" height="4" rx="1.5"></rect></svg>
            irisqo
          </a>
        </li>
      </ul>
      <ul>
        <li><a href="/ui/jobs/new" class="cta"{% if nav == "new" %} aria-current="page"{% endif %}>New job</a></li>
      </ul>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
