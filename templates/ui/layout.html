<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="htmx-config" content='{"includeIndicatorCSS": false, "morphIgnore": ["data-htmx-powered", "open"]}'>
  <title>{% block title %}{% endblock %} · irisqo</title>
  <script src="/ui/assets/theme.js"></script>
  <link rel="icon" href="/ui/assets/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/ui/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/ui/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/ui/assets/pico-2.1.1.classless.min.css">
  <link rel="stylesheet" href="/ui/assets/app.css">
  <script src="/ui/assets/htmx-4.0.1.min.js" defer></script>
</head>
<body>
  <header>
    <nav aria-label="Main">
      <ul>
        <li>
          <a href="/ui" class="brand" aria-label="irisqo">
            <img src="/ui/assets/logo.svg" width="32" height="32" alt="">
            <span class="brand-name">irisqo</span>
          </a>
        </li>
        <li><a href="/ui/jobs"{% if nav == "jobs" %} aria-current="page"{% endif %}>Jobs</a></li>
        <li><a href="/ui/schedules"{% if nav == "schedules" %} aria-current="page"{% endif %}>Schedules</a></li>
        <li><a href="/ui/instances"{% if nav == "instances" %} aria-current="page"{% endif %}>Instances</a></li>
      </ul>
      <ul>
        <li>
          <button type="button" id="theme-toggle" class="theme-toggle" hidden>
            <svg class="i-auto" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"></path></svg>
            <svg class="i-light" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
            <svg class="i-dark" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
          </button>
        </li>
        <li><a href="/ui/jobs/new" class="cta"{% if nav == "new" %} aria-current="page"{% endif %}>New<span class="cta-more"> job</span></a></li>
      </ul>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
